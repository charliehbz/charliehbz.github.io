<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDD 案例 · 已移到作品集首页</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://charliehbz.github.io/#edd">
<!-- 兼容旧链接：这个案例已经合进作品集首页（index.html）。打开这里会直接跳到 /#edd；
     旧地址上的看板、演示锚点（#demo, #dashboard, #dashboard-gmv, #dashboard-shipping, #ai-brief）会一并带过去。 -->
<script>
  (function () {
    var keep = ['demo', 'dashboard', 'dashboard-gmv', 'dashboard-shipping', 'ai-brief'], h = location.hash.slice(1);
    // online '/' serves index.html; a local file:// folder does not, so name the file there
    location.replace((location.protocol === 'file:' ? '../index.html' : '../') + '#' + (keep.indexOf(h) >= 0 ? h : 'edd'));
  })();
</script>
<meta http-equiv="refresh" content="0; url=../#edd">
</head>
<body>
<p>EDD 案例已移到作品集首页：<a href="../#edd">打开案例</a>。<br>The EDD case now lives on the portfolio home page: <a href="../#edd">open it</a>.</p>
</body>
</html>
